<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH-Atlas · 对话画布原型</title>
<style>
  :root{
    --bg:#0b0f14;
    --bg2:#0f141b;
    --line:#202a37;
    --ink:#e6edf3;
    --muted:#8b98a9;
    --accent:#6ea8fe;
    --green:#7ee787;
    --amber:#f2cc60;
    --paper:#fbf9f4;
    --paper2:#f3efe6;
    --paper-ink:#1d232b;
    --paper-muted:#6b7280;
    --paper-line:#e3ddd0;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit}
  ::selection{background:rgba(110,168,254,.28)}

  /* ---------- canvas ---------- */
  #canvas{position:fixed;inset:0;overflow:hidden;cursor:grab;z-index:1;background:
    radial-gradient(900px 600px at 18% 12%, rgba(110,168,254,.07), transparent 60%),
    radial-gradient(900px 700px at 82% 82%, rgba(126,231,135,.045), transparent 60%),
    var(--bg);}
  #canvas.panning{cursor:grabbing}
  #grid{position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(circle, rgba(255,255,255,.075) 1px, transparent 1px);
    background-size:26px 26px;background-position:0 0;}
  #vignette{position:absolute;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(120% 90% at 50% 42%, transparent 52%, rgba(0,0,0,.45));}
  #world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;z-index:2}
  #edges{position:absolute;left:-4000px;top:-4000px;overflow:visible;pointer-events:none;z-index:1}
  #edges path{fill:none;stroke:#2a3748;stroke-width:1.4}
  #edges path.active{stroke:#3f6a9e}

  /* ---------- nodes ---------- */
  #nodes{position:absolute;left:0;top:0;z-index:2}
  .node{
    position:absolute;width:280px;height:92px;padding:13px 16px;
    border-radius:14px;border:1px solid #243041;
    background:linear-gradient(180deg,#151d27,#101720);
    box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.035);
    cursor:pointer;user-select:none;
    transition:border-color .18s, box-shadow .18s, transform .18s, background .18s;
  }
  .node:hover{border-color:#3a4b63;transform:translateY(-2px);box-shadow:0 16px 38px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05)}
  .node.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 18px 44px rgba(110,168,254,.16)}
  .node .kind{position:absolute;top:12px;right:14px;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#6f7f93}
  .node .title{font-size:16px;font-weight:650;letter-spacing:-.01em;color:#e9f0f8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:58px}
  .node .title::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;vertical-align:2px;background:#3d4b5e}
  .node.done .title::before{background:var(--green)}
  .node.active .title::before{background:var(--accent);animation:pulse 2.6s infinite}
  .node.seed .title::before{background:#48566a}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(110,168,254,.45)}50%{box-shadow:0 0 0 5px rgba(110,168,254,0)}}
  .node .sub{margin-top:5px;font-size:12px;color:#8b98a9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .node .meta{position:absolute;left:16px;right:16px;bottom:11px;display:flex;align-items:center;gap:9px;font-size:10.5px;color:#758396}
  .mastery{display:inline-flex;gap:3px;align-items:center}
  .mastery i{width:5px;height:5px;border-radius:50%;background:#2b3849;display:block}
  .mastery i.on{background:#8fb7ff}

  /* semantic zoom */
  #world.far .node .sub,
  #world.far .node .meta,
  #world.far .node .kind{opacity:0}
  #world.far .node{display:flex;align-items:center;padding-top:0;background:rgba(18,25,35,.9)}
  #world.far .node .title{font-size:17px;padding-right:0;width:100%}

  /* ---------- top bar ---------- */
  #topbar{
    position:fixed;top:0;left:0;right:0;height:66px;z-index:30;
    display:flex;align-items:center;gap:18px;padding:0 20px;
    background:linear-gradient(180deg, rgba(9,12,17,.94), rgba(9,12,17,.6) 62%, transparent);
    pointer-events:none;
  }
  #topbar > *{pointer-events:auto}
  .brand{display:flex;align-items:center;gap:10px}
  .mark{width:24px;height:24px;border-radius:8px;background:conic-gradient(from 210deg,#6ea8fe,#7ee787,#f2cc60,#6ea8fe);
    box-shadow:inset 0 0 0 6px #0b0f14, 0 0 0 1px rgba(255,255,255,.08)}
  .brand-name{font-size:14px;font-weight:700;letter-spacing:.01em}
  .brand-tag{font-size:11px;color:#6f7f93;border:1px solid #263241;border-radius:999px;padding:3px 8px}
  .topcrumb{margin-left:14px;display:flex;align-items:center;gap:8px;font-size:12px;color:#7c8a9c}
  .topcrumb i{font-style:normal;color:#3d4b5e}
  .topcrumb b{color:#b9c6d6;font-weight:500}
  .top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
  .btn{height:34px;padding:0 12px;border-radius:9px;border:1px solid #263241;background:rgba(20,27,37,.72);
    color:#c8d4e3;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
    transition:background .15s,border-color .15s}
  .btn:hover{background:#1a2330;border-color:#3a4b63}
  .btn.ghost{background:transparent}

  /* ---------- zoom / legend / hint ---------- */
  #zoomctl{position:fixed;left:18px;bottom:18px;z-index:20;display:flex;align-items:center;gap:2px;padding:5px;
    border:1px solid #263241;background:rgba(17,23,32,.82);backdrop-filter:blur(10px);border-radius:11px}
  #zoomctl button{width:28px;height:28px;border:0;background:none;color:#a9b7c8;border-radius:7px;cursor:pointer;font-size:15px;line-height:1}
  #zoomctl button:hover{background:#212c3a;color:#fff}
  #zoomlabel{min-width:46px;text-align:center;font-size:11.5px;color:#8b98a9;font-variant-numeric:tabular-nums}
  #legend{position:fixed;right:18px;bottom:20px;z-index:20;display:flex;gap:14px;font-size:11px;color:#7c8a9c}
  #legend span{display:inline-flex;align-items:center;gap:6px}
  #legend i{width:6px;height:6px;border-radius:50%;display:block}
  #legend i.done{background:var(--green)}
  #legend i.active{background:var(--accent)}
  #legend i.seed{background:#4a586c}
  #hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:20;
    font-size:11.5px;color:#7c8a9c;background:rgba(17,23,32,.72);border:1px solid #202a37;border-radius:999px;
    padding:7px 14px;backdrop-filter:blur(8px);transition:opacity .6s}
  #hint.fade{opacity:0}

  /* ---------- sheet ---------- */
  #scrim{position:fixed;inset:0;z-index:40;background:rgba(4,7,10,.46);backdrop-filter:blur(5px);
    opacity:0;pointer-events:none;transition:opacity .25s}
  #scrim.show{opacity:1;pointer-events:auto}
  #sheet{position:fixed;inset:0;z-index:50;display:grid;place-items:center;pointer-events:none}
  #sheet .card{
    position:relative;width:min(980px,calc(100vw - 76px));height:min(760px,calc(100vh - 76px));
    background:var(--paper);color:var(--paper-ink);border-radius:20px;overflow:hidden;
    box-shadow:0 50px 140px rgba(0,0,0,.62), 0 0 0 1px rgba(255,255,255,.06);
    display:flex;flex-direction:column;
    visibility:hidden;transform:translateY(10px) scale(.965);
    transition:transform .28s cubic-bezier(.22,.8,.3,1);
  }
  #sheet.open .card{visibility:visible;transform:none;pointer-events:auto}

  .sheet-head{padding:18px 22px 14px;border-bottom:1px solid var(--paper-line);display:flex;align-items:flex-start;gap:16px}
  .sheet-head .crumb{font-size:11.5px;color:var(--paper-muted);display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .sheet-head .crumb i{font-style:normal;color:#c3bbaa}
  .sheet-head h2{margin:0;font-size:21px;letter-spacing:-.015em;line-height:1.2;color:#161b22}
  .sheet-head .subline{margin-top:5px;font-size:12px;color:var(--paper-muted);display:flex;align-items:center;gap:8px}
  .pill{display:inline-flex;align-items:center;gap:5px;border:1px solid #d9d2c3;border-radius:999px;padding:2px 8px;font-size:10.5px;color:#6b7280;background:#fff}
  .pill.green{border-color:#bfe3cb;background:#f1fbf4;color:#2f7d4a}
  .head-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .field{display:flex;align-items:center;gap:7px;height:34px;padding:0 10px;border:1px solid #ded6c7;border-radius:9px;background:#fff;color:#6b7280}
  .field input{border:0;outline:0;background:none;font-size:12.5px;width:152px;color:#20262e}
  .field input::placeholder{color:#9aa2ae}
  .count{font-size:10.5px;color:#9aa2ae;white-space:nowrap}
  .pbtn{height:34px;padding:0 12px;border-radius:9px;border:1px solid #ded6c7;background:#fff;color:#3b4452;
    font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s}
  .pbtn:hover{border-color:#c8bfad;background:#fdfcf9}
  .pbtn.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
  .pbtn.primary:hover{background:#1a5fcc}
  .pbtn.close{width:34px;justify-content:center;font-size:17px;color:#8a94a3;padding:0}

  .sheet-main{flex:1;display:grid;grid-template-columns:198px 1fr;grid-template-rows:minmax(0,1fr);min-height:0}
  .outline{border-right:1px solid var(--paper-line);background:var(--paper2);padding:14px 10px 20px;overflow:auto;min-height:0}
  .outline-head{display:flex;align-items:center;justify-content:space-between;padding:0 8px 8px;font-size:10px;
    letter-spacing:.1em;text-transform:uppercase;color:#8a8272}
  .outline-head div{display:flex;gap:2px}
  .outline-head button{border:0;background:none;color:#8a8272;cursor:pointer;font-size:13px;padding:2px 4px;border-radius:5px}
  .outline-head button:hover{background:#e7e0d2;color:#3b4452}
  #outlineList a{display:block;text-decoration:none;font-size:12.5px;color:#4a5361;padding:6px 8px;border-radius:7px;
    line-height:1.35;margin-bottom:1px;border-left:2px solid transparent}
  #outlineList a:hover{background:#e9e3d5;color:#20262e}
  #outlineList a.lvl3{padding-left:20px;font-size:12px;color:#6b7280}
  #outlineList a.top{font-weight:600;color:#20262e}

  .chat{overflow:auto;padding:24px 36px 168px;min-height:0}
  .chat::-webkit-scrollbar{width:9px}
  .chat::-webkit-scrollbar-thumb{background:#ddd5c6;border-radius:9px;border:2px solid var(--paper)}
  .chat::-webkit-scrollbar-track{background:transparent}

  .msg{margin:0 0 16px}
  .msg .who{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#9aa2ae;margin-bottom:5px}
  .msg.user{display:flex;flex-direction:column;align-items:flex-end}
  .msg.user .bubble{max-width:78%;background:#eaf2ff;border:1px solid #d6e4fa;color:#1c2b3f;
    padding:10px 13px;border-radius:12px 12px 4px 12px;font-size:13.5px;line-height:1.6}
  .msg.ai .md{font-size:13.8px;line-height:1.72;color:#252b34}
  .msg.ai .md p{margin:0 0 9px}
  .msg.ai .md ul,.msg.ai .md ol{margin:4px 0 10px;padding-left:20px}
  .msg.ai .md li{margin:3px 0}
  .msg.ai .md code{background:#efe9dc;border:1px solid #e3dbc9;border-radius:5px;padding:1px 5px;font-size:12px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .msg.ai .md strong{color:#11161d}
  .msg.ai .md .muted{color:#7a8390;font-size:12.5px}

  .sec{margin:26px 0 0;border-top:1px solid var(--paper-line);padding-top:2px}
  .sec:first-of-type{border-top:0}
  .sec-head{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:9px 0 8px;
    cursor:pointer;text-align:left;color:#1b212a}
  .sec-head:hover .sec-title{color:#1f6feb}
  .chev{display:inline-block;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;
    border-top:5px solid #8a94a3;font-size:0;line-height:0;vertical-align:middle;transition:transform .2s;transform-origin:50% 45%}
  .sec.closed .chev{transform:rotate(-90deg)}
  .sec-title{font-size:15.5px;font-weight:700;letter-spacing:-.01em;line-height:1.35}
  .sec.lvl3 .sec-title{font-size:14px}
  .sec.lvl3{margin-left:16px;border-top:1px dashed #e6dfd0}
  .sec-meta{margin-left:auto;font-size:10.5px;color:#9aa2ae;white-space:nowrap;padding-left:10px}
  .sec-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .26s ease}
  .sec.closed .sec-body{grid-template-rows:0fr}
  .sec-body > .sec-inner{overflow:hidden;min-height:0}
  .sec-pad{padding:12px 0 8px}
  .sec.filtered-out{display:none}
  .sec.search-hit .sec-head{background:#fff8e6;border-radius:8px;margin-left:-8px;padding-left:8px;padding-right:8px}

  .subchat{margin:14px 0 6px 18px;border-left:2px dashed #cfd8e6;padding-left:16px}
  .sub-head{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 0 6px;user-select:none}
  .sub-head:hover .sub-title{color:#1f6feb}
  .sub-title{font-size:13px;font-weight:650;color:#334155}
  .sub-meta{font-size:10px;color:#9aa2ae}
  .sub-actions{margin-left:auto;display:flex;gap:6px}
  .promote{border:1px solid #d9d2c3;background:#fff;color:#6b7280;font-size:10px;padding:3px 7px;border-radius:999px;cursor:pointer}
  .promote:hover{border-color:#b9cdf0;color:#1f6feb;background:#f7faff}
  .sub-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .24s ease}
  .subchat.open .sub-body{grid-template-rows:1fr}
  .sub-body > .sub-inner{overflow:hidden;min-height:0}
  .sub-pad{padding:8px 0 4px}
  .subchat .msg .md{font-size:13px;background:#f6f8fc;border:1px solid #e6ebf4;border-radius:10px;padding:10px 12px}
  .subchat .msg .md p:last-child{margin-bottom:0}

  .closure{margin:22px 0;border:1px solid #cfe8d6;background:#f4fbf6;border-radius:14px;padding:15px 17px}
  .closure-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .closure-badge{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#2f7d4a;background:#e3f5e9;border-radius:999px;padding:2px 8px}
  .closure-time{font-size:10px;color:#9aa2ae}
  .closure h4{margin:0 0 7px;font-size:14px;color:#1c3325}
  .closure ul{margin:0;padding-left:18px;font-size:12.5px;line-height:1.7;color:#3c4a42}
  .closure-foot{margin-top:9px;font-size:10.5px;color:#6b7280;display:flex;gap:14px}

  .composer{position:absolute;left:0;right:0;bottom:0;padding:14px 22px 18px;z-index:5;
    background:linear-gradient(to top, var(--paper) 58%, rgba(251,249,244,0))}
  .composer .box{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #ded6c7;border-radius:14px;
    padding:8px 8px 8px 13px;box-shadow:0 8px 24px rgba(31,38,48,.08)}
  .composer input{flex:1;border:0;outline:0;background:none;font-size:13.5px;color:#20262e;padding:6px 0}
  .composer input::placeholder{color:#a2a9b4}
  .composer .send{width:32px;height:32px;border-radius:9px;border:0;background:#1f6feb;color:#fff;cursor:pointer;font-size:15px}
  .composer .send:hover{background:#1a5fcc}
  .composer .tip{font-size:10px;color:#a2a9b4;margin:7px 2px 0;display:flex;gap:10px}

  #toast{position:fixed;left:50%;bottom:30px;z-index:80;transform:translateX(-50%) translateY(8px);
    background:#1b2430;color:#dbe7f5;border:1px solid #2c3b4e;padding:9px 15px;border-radius:999px;
    font-size:12px;opacity:0;pointer-events:none;transition:.24s;box-shadow:0 12px 30px rgba(0,0,0,.4)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:900px){
    .sheet-main{grid-template-columns:1fr}
    .outline{display:none}
    #sheet .card{width:calc(100vw - 28px);height:calc(100vh - 28px)}
    .topcrumb{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
  body.no-anim *{transition:none !important;animation:none !important}
</style>
</head>
<body>

<div id="canvas">
  <div id="grid"></div>
  <div id="world">
    <svg id="edges" width="8000" height="8000" viewBox="-4000 -4000 8000 8000"></svg>
    <div id="nodes"></div>
  </div>
  <div id="vignette"></div>
</div>

<header id="topbar">
  <div class="brand">
    <span class="mark"></span>
    <span class="brand-name">DSH-Atlas</span>
    <span class="brand-tag">对话画布 · 原型</span>
  </div>
  <div class="topcrumb"><span>数据库系统</span><i>/</i><span>学习地图</span><i>/</i><b>8 个模块</b></div>
  <div class="top-actions">
    <button class="btn ghost" id="tidyBtn" title="恢复自动布局">整理</button>
    <button class="btn ghost" id="fitBtn" title="适配窗口（F）">适配</button>
    <button class="btn ghost" id="helpBtn" title="快捷键">?</button>
  </div>
</header>

<div id="zoomctl">
  <button id="zout" title="缩小">−</button>
  <span id="zoomlabel">100%</span>
  <button id="zin" title="放大">+</button>
  <button id="zfit" title="适配窗口">⤢</button>
</div>

<div id="legend">
  <span><i class="done"></i>已收口</span>
  <span><i class="active"></i>进行中</span>
  <span><i class="seed"></i>未开始</span>
</div>

<div id="hint">滚轮缩放 · 拖拽平移 / 移动节点 · 点击节点进入对话</div>

<div id="scrim"></div>

<section id="sheet" aria-hidden="true" aria-label="节点对话">
  <div class="card" role="dialog" aria-modal="true">
    <header class="sheet-head">
      <div style="min-width:0">
        <div class="crumb" id="crumb"></div>
        <h2 id="sheetTitle">节点</h2>
        <div class="subline" id="sheetSubline"></div>
      </div>
      <div class="head-actions">
        <label class="field" title="搜索标题与内容">
          <span style="font-size:12px">⌕</span>
          <input id="search" type="search" placeholder="搜索内容…" autocomplete="off">
          <span class="count" id="searchCount"></span>
        </label>
        <button class="pbtn" id="locateBtn" title="回到画布并定位">定位</button>
        <button class="pbtn primary" id="closeNodeBtn" title="生成收口卡并关闭">收口</button>
        <button class="pbtn close" id="closeSheetBtn" title="关闭（Esc）">×</button>
      </div>
    </header>

    <div class="sheet-main">
      <nav class="outline" aria-label="本节目录">
        <div class="outline-head">
          <span>本节目录</span>
          <div>
            <button id="collapseAll" title="折叠全部">⊟</button>
            <button id="expandAll" title="展开全部">⊞</button>
          </div>
        </div>
        <div id="outlineList"></div>
      </nav>
      <main class="chat" id="chatScroll"></main>
    </div>

    <footer class="composer">
      <div class="box">
        <input id="input" type="text" placeholder="继续追问这个节点…（原型不会真的调用模型）" autocomplete="off">
        <button class="send" id="send" title="发送（Enter）">↑</button>
      </div>
      <div class="tip"><span>Enter 发送</span><span>Esc 关闭</span><span>标题可折叠，像 Word 的标题一样</span></div>
    </footer>
  </div>
</section>

<div id="toast"></div>

<script>
(function(){
  "use strict";

  /* ============ data ============ */
  var NODE_W = 280, NODE_H = 92;

  var BASE = [
    {id:'root', parent:null, x:0, y:0, title:'数据库系统', sub:'8 个模块 · 复习中', kind:'总览', status:'active', mastery:3, meta:'8 个节点'},
    {id:'m1', parent:'root', x:380, y:-360, title:'01 存储引擎', sub:'页 · 缓冲池 · 堆文件', kind:'模块', status:'done', mastery:4, meta:'9 轮'},
    {id:'m2', parent:'root', x:380, y:-260, title:'02 索引', sub:'B+ 树 · LSM · 哈希', kind:'模块', status:'active', mastery:3, meta:'12 轮'},
    {id:'m3', parent:'root', x:380, y:-160, title:'03 查询处理', sub:'解析 · 优化 · 执行', kind:'模块', status:'seed', mastery:0, meta:'未开始'},

  function apply(){

    var far = cam.s < 0.55, near = cam.s >= 0.95;
    world.classList.toggle('far', far);
    world.classList.toggle('near', near);
    $('#zoomlabel').textContent = Math.round(cam.s * 100) + '%';
    var grid = $('#grid');

    grid.style.backgroundSize = size + 'px ' + size + 'px';
    grid.style.backgroundPosition = cam.x + 'px ' + cam.y + 'px';
  }

  function zoomAt(mx, my, factor){
    var wx = (mx - cam.x) / cam.s;
    var wy = (my - cam.y) / cam.s;
    var ns = Math.max(0.28, Math.min(2.4, cam.s * factor));
    cam.x = mx - wx * ns;
    cam.y = my - wy * ns;
    cam.s = ns;
    touched = true;
    apply();
  }

  function fit(pad){
    pad = pad || 92;
    var xs = nodes.map(function(n){ return n.x; });
    var xe = nodes.map(function(n){ return n.x + NODE_W; });
    var ys = nodes.map(function(n){ return n.y; });
    var ye = nodes.map(function(n){ return n.y + NODE_H; });
    var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xe);
    var minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ye);
    var s = Math.min((window.innerWidth - pad*2) / (maxX-minX), (window.innerHeight - pad*2) / (maxY-minY), 1.15);
    s = Math.max(0.3, s);
    cam.s = s;
    cam.x = window.innerWidth/2 - (minX+maxX)/2 * s;
    cam.y = window.innerHeight/2 - (minY+maxY)/2 * s;
    apply();
  }

  function ease(t){ return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }

    cancelAnimationFrame(camAnim);
    var sx = cam.x, sy = cam.y, ss = cam.s, t0 = performance.now();
    dur = dur || 600;
    function step(now){
      var k = Math.min(1, (now - t0) / dur);
      var e = ease(k);
      cam.x = sx + (tx - sx) * e;
      cam.y = sy + (ty - sy) * e;
      cam.s = ss + (ts - ss) * e;
      apply();
      if (k < 1) camAnim = requestAnimationFrame(step);
    }
    camAnim = requestAnimationFrame(step);
  }

    if (q){
      $$('.subchat').forEach(function(sub){
        if (sub.textContent.toLowerCase().indexOf(q) >= 0) sub.classList.add('open');
      });
    }
    $('#searchCount').textContent = q ? count + ' 节' : '';
  });

  /* ============ composer ============ */
  function scrollBottom(){
    var el = $('#chatScroll');
    el.scrollTo({top: el.scrollHeight, behavior:'smooth'});
  }

  function canned(text){
    if (/页分裂|分裂/.test(text)) return '（原型回答）页分裂的本质是“把一页的写压力分摊到两页”，代价是父节点更新和空间碎片。想深挖可以看分裂策略：50/50、右倾、以及 B* 树的兄弟借位。';
    if (/索引|B\+|回表/.test(text)) return '（原型回答）可以沿着“扇出 → 树高 → I/O 次数”这条链推：扇出越大，树越矮，点查越省 I/O；但范围查询还要看叶子链表和聚簇方式。';
    return '（原型回答）这个问题可以拆成三层：它解决什么、代价是什么、什么时候不适用。你想先展开哪一层？';
  }

  function send(){
    var input = $('#input');
    var text = input.value.trim();
    if (!text) return;
    input.value = '';
    var live = $('#chatScroll .live');
    if (!live){
      live = document.createElement('div');
      live.className = 'live';
      $('#chatScroll').appendChild(live);
    }
    live.insertAdjacentHTML('beforeend',
      '<div class="msg user"><div class="who">你</div><div class="bubble">' + esc(text) + '</div></div>');
    var ai = document.createElement('div');
    ai.className = 'msg ai';
    ai.innerHTML = '<div class="who">AI</div><div class="md"><p class="muted">思考中…</p></div>';
    live.appendChild(ai);
    scrollBottom();
    setTimeout(function(){
      ai.querySelector('.md').innerHTML = '<p>' + esc(canned(text)) + '</p>';
      scrollBottom();
    }, 620);
  }

  /* ============ events ============ */
  $('#nodes').addEventListener('pointerdown', function(e){
    var el = e.target.closest('.node');
    if (!el) return;
    e.stopPropagation();
    var n = byId(el.dataset.id);
    if (!n) return;
    drag = {id:n.id, sx:e.clientX, sy:e.clientY, nx:n.x, ny:n.y, moved:false, el:el};
    try { el.setPointerCapture(e.pointerId); } catch(err){}
  });

  $('#nodes').addEventListener('pointermove', function(e){
    if (!drag) return;
    var dx = (e.clientX - drag.sx) / cam.s;
    var dy = (e.clientY - drag.sy) / cam.s;
    if (!drag.moved && Math.sqrt(dx*dx + dy*dy) > 4) drag.moved = true;
    if (!drag.moved) return;
    touched = true;
    var n = byId(drag.id);
    n.x = drag.nx + dx;
    n.y = drag.ny + dy;
    drag.el.style.left = n.x + 'px';
    drag.el.style.top = n.y + 'px';
    renderEdges();
  });

  $('#nodes').addEventListener('pointerup', function(e){
    if (!drag) return;
    var d = drag;
    drag = null;
    if (!d.moved) openNode(d.id);
  });

  $('#canvas').addEventListener('pointerdown', function(e){
    if (e.target.closest('.node')) return;
    if (e.target.closest('#zoomctl') || e.target.closest('#hint')) return;
    pan = {sx:e.clientX, sy:e.clientY, cx:cam.x, cy:cam.y};
    $('#canvas').classList.add('panning');
    try { $('#canvas').setPointerCapture(e.pointerId); } catch(err){}
  });

  $('#canvas').addEventListener('pointermove', function(e){
    if (!pan) return;
    cam.x = pan.cx + (e.clientX - pan.sx);
    cam.y = pan.cy + (e.clientY - pan.sy);
    touched = true;
    apply();
  });

  $('#canvas').addEventListener('pointerup', function(){
    pan = null;
    $('#canvas').classList.remove('panning');
  });

  $('#canvas').addEventListener('wheel', function(e){
    e.preventDefault();
    var factor = Math.exp(-e.deltaY * 0.0012);
    zoomAt(e.clientX, e.clientY, factor);
  }, {passive:false});

  $('#canvas').addEventListener('dblclick', function(e){
    if (e.target.closest('.node')) return;
    fit(92);
  });

  $('#zin').addEventListener('click', function(){ zoomAt(window.innerWidth/2, window.innerHeight/2, 1.22); });
  $('#zout').addEventListener('click', function(){ zoomAt(window.innerWidth/2, window.innerHeight/2, 1/1.22); });
  $('#zfit').addEventListener('click', function(){ fit(92); });
  $('#fitBtn').addEventListener('click', function(){ fit(92); });
  $('#tidyBtn').addEventListener('click', function(){
    nodes.forEach(function(n){
      var b = BASE.filter(function(x){ return x.id===n.id; })[0];
      if (b){ n.x = b.x; n.y = b.y; }
    });
    renderNodes();
    fit(92);
    toast('已恢复自动布局');
  });
  $('#helpBtn').addEventListener('click', function(){
    toast('滚轮缩放 · 拖拽平移 · 点节点进入对话 · Esc 关闭 · F 适配');
  });

  $('#closeSheetBtn').addEventListener('click', closeSheet);
  $('#scrim').addEventListener('click', closeSheet);
  $('#locateBtn').addEventListener('click', function(){
    var n = byId(activeId);
    closeSheet();
    if (n) setTimeout(function(){ focusNode(n, 600); toast('已定位到画布'); }, 180);
  });
  $('#closeNodeBtn').addEventListener('click', closeNode);

  $('#collapseAll').addEventListener('click', function(){
    $$('#chatScroll .sec').forEach(function(s){ s.classList.add('closed'); });
  });
  $('#expandAll').addEventListener('click', function(){
    $$('#chatScroll .sec').forEach(function(s){ s.classList.remove('closed'); });
  });

  $('#send').addEventListener('click', send);
  $('#input').addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){
      if ($('#sheet').classList.contains('open')) closeSheet();
    }
    if (e.key === 'f' || e.key === 'F'){
      if (!e.target.closest('input,textarea')) fit(92);
    }
  });

  /* ============ init ============ */
  if (location.search.indexOf('still') >= 0) document.body.classList.add('no-anim');
  renderNodes();
  if (!location.hash){
    requestAnimationFrame(function(){ fit(92); });
    setTimeout(function(){ if (!touched) fit(92); }, 220);
    window.addEventListener('load', function(){ if (!touched) fit(92); });
  }
  window.addEventListener('resize', function(){
    if (!touched && !$('#sheet').classList.contains('open')) fit(92);
  });
  setTimeout(function(){ $('#hint').classList.add('fade'); }, 8500);

  if (location.hash){
    var hp = location.hash.slice(1).split('/');
    if (byId(hp[0])) setTimeout(function(){
      openNode(hp[0]);
      if (hp[1] === 'sub') setTimeout(function(){
        var sub = document.querySelector('.subchat');
        if (sub){
          sub.classList.add('open');
          var sc = $('#chatScroll');
          var r = sub.getBoundingClientRect(), c = sc.getBoundingClientRect();
          sc.scrollTop = sc.scrollTop + (r.top - c.top) - 150;
        }
      }, 250);
    }, 150);
  }
})();
</script>
</body>
</html>
